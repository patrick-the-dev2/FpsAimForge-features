name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            python3 \
            curl \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev

      - name: Verify legacy gameplay parity
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path

          files = [
              "src/aim/core/camera.cc",
              "src/aim/scenario/base_scenario.cc",
              "src/aim/scenario/base_scenario.h",
              "src/resources/bundles/AF.bundle.json",
          ]
          for path in files:
              url = "https://raw.githubusercontent.com/mjohns/FpsAimForge/main/" + path
              with urllib.request.urlopen(url, timeout=30) as response:
                  upstream = response.read()
              local = Path(path).read_bytes()
              if local != upstream:
                  raise SystemExit(f"LEGACY PARITY FAILURE: {path}")
              print(f"legacy parity OK: {path}")
          PY

      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build FpsAimForge
        run: cmake --build build --target FpsAimForge --parallel 2

      - name: Run tests
        run: |
          cmake --build build --target FpsAimForgeTests --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Package release binary
        run: |
          mkdir -p release
          cp build/bin/FpsAimForge release/FpsAimForge
          cp -r src/resources release/resources
          cp -r build/bin/shaders release/shaders

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-release
          path: release/
          if-no-files-found: error


  windows-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify legacy gameplay parity
        shell: pwsh
        run: |
          $files = @(
            "src/aim/core/camera.cc",
            "src/aim/scenario/base_scenario.cc",
            "src/aim/scenario/base_scenario.h",
            "src/resources/bundles/AF.bundle.json"
          )
          foreach ($path in $files) {
            $url = "https://raw.githubusercontent.com/mjohns/FpsAimForge/main/$path"
            $upstream = (Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 30).Content
            $local = [System.IO.File]::ReadAllText((Resolve-Path $path))
            if ($local -ne $upstream) { throw "LEGACY PARITY FAILURE: $path" }
            Write-Host "legacy parity OK: $path"
          }

      - name: Configure Windows x64 release
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64

      - name: Build FpsAimForge
        run: cmake --build build-windows --config Release --target FpsAimForge --parallel 2

      - name: Build and run tests
        run: |
          cmake --build build-windows --config Release --target FpsAimForgeTests --parallel 2
          ctest --test-dir build-windows --build-config Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item build-windows/bin/Release/FpsAimForge.exe release-windows/FpsAimForge.exe
          Copy-Item -Recurse src/resources release-windows/resources
          Copy-Item -Recurse build-windows/bin/shaders release-windows/shaders

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-windows-x64
          path: release-windows/
          if-no-files-found: error
