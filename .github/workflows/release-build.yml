name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            python3 \
            curl \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev

      - name: Verify legacy gameplay parity
        shell: bash
        run: |
          git fetch --depth=1 https://github.com/mjohns/FpsAimForge.git main
          git diff --exit-code FETCH_HEAD -- \
            src/aim/core/camera.cc \
            src/aim/scenario/base_scenario.cc \
            src/aim/scenario/base_scenario.h \
            src/resources/bundles/AF.bundle.json
      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build FpsAimForge
        run: cmake --build build --target FpsAimForge --parallel 2

      - name: Run tests
        run: |
          cmake --build build --target FpsAimForgeTests --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Package release binary
        run: |
          mkdir -p release
          cp build/bin/FpsAimForge release/FpsAimForge
          cp -r src/resources release/resources
          cp -r build/bin/shaders release/shaders

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-release
          path: release/
          if-no-files-found: error


  windows-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify legacy gameplay parity
        shell: pwsh
        run: |
          git fetch --depth=1 https://github.com/mjohns/FpsAimForge.git main
          git diff --exit-code FETCH_HEAD -- src/aim/core/camera.cc src/aim/scenario/base_scenario.cc src/aim/scenario/base_scenario.h src/resources/bundles/AF.bundle.json
      - name: Configure Windows x64 release
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build FpsAimForge
        run: cmake --build build-windows --config Release --target FpsAimForge --parallel 2

      - name: Build and run tests
        run: |
          cmake --build build-windows --config Release --target FpsAimForgeTests --parallel 2
          ctest --test-dir build-windows --build-config Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item build-windows/bin/Release/FpsAimForge.exe release-windows/FpsAimForge.exe
          Copy-Item -Recurse src/resources release-windows/resources
          Copy-Item -Recurse build-windows/bin/shaders release-windows/shaders
          if (-not (Test-Path release-windows/FpsAimForge.exe)) { throw "Windows executable missing from release package." }
          $shaderCount = (Get-ChildItem -Recurse -File release-windows/shaders | Measure-Object).Count
          if ($shaderCount -lt 1) { throw "Compiled shader package is empty." }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-windows-x64
          path: release-windows/
          if-no-files-found: error
